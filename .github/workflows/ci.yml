name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      force_api_build:
        description: Force the API image build
        required: false
        default: false
        type: boolean
      force_web_build:
        description: Force the web image build
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  docs:
    name: Check README links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check repository-local documentation links
        run: npm run check:docs

  e2e:
    name: E2E Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Node dependencies
        run: npm ci
      - name: Install Chromium and dependencies
        run: npx playwright install --with-deps chromium
      - name: Run browser authentication journeys
        run: npm run test:e2e
      - name: Upload E2E report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-chromium
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      full: ${{ steps.scope.outputs.full }}
      node: ${{ steps.scope.outputs.node }}
      api: ${{ steps.scope.outputs.api }}
      web: ${{ steps.scope.outputs.web }}
      agent: ${{ steps.scope.outputs.agent }}
      installer: ${{ steps.scope.outputs.installer }}
      updater: ${{ steps.scope.outputs.updater }}
      db: ${{ steps.scope.outputs.db }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed paths
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            node:
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig*.json'
              - 'vitest.config.ts'
              - 'packages/api/**'
              - 'packages/web/**'
              - 'scripts/**'
              - 'public/**'
            api:
              - 'Dockerfile'
              - '.dockerignore'
              - '.github/workflows/ci.yml'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig*.json'
              - 'packages/api/**'
              - 'packages/web/**'
              - 'packages/agent/**'
              - 'scripts/**'
              - 'public/**'
              - 'docker/**'
            web:
              - 'Dockerfile'
              - '.dockerignore'
              - '.github/workflows/ci.yml'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig*.json'
              - 'packages/api/**'
              - 'packages/web/**'
              - 'packages/agent/**'
              - 'scripts/**'
              - 'public/**'
              - 'docker/**'
            agent:
              - 'packages/agent/**'
              - 'scripts/agent/**'
              - 'package.json'
              - 'package-lock.json'
            installer:
              - 'scripts/install/install.sh'
              - 'scripts/install/install-local-agent.sh'
              - 'scripts/tests/test-installer-docker-access.sh'
              - 'scripts/tests/**'
              - 'Dockerfile'
              - 'docker-compose.yml'
              - '.github/workflows/ci.yml'
            updater:
              - 'scripts/install/install.sh'
              - 'scripts/install/install-local-agent.sh'
              - 'scripts/install/install-updater.sh'
              - 'scripts/tests/test-updater.sh'
              - 'packages/agent/**'
              - 'scripts/tests/**'
              - 'scripts/release/**'
              - 'packages/api/src/scripts/bootstrap-local-agent.ts'
              - 'Dockerfile'
              - 'docker-compose.yml'
              - '.github/workflows/ci.yml'
            db:
              - 'packages/api/**'
              - 'package.json'
              - 'package-lock.json'
              - 'vitest.config.ts'
              - '.github/workflows/ci.yml'

      - name: Compute effective change scope
        id: scope
        env:
          RAW_NODE: ${{ steps.changes.outputs.node }}
          RAW_API: ${{ steps.changes.outputs.api }}
          RAW_WEB: ${{ steps.changes.outputs.web }}
          RAW_AGENT: ${{ steps.changes.outputs.agent }}
          RAW_INSTALLER: ${{ steps.changes.outputs.installer }}
          RAW_UPDATER: ${{ steps.changes.outputs.updater }}
          RAW_DB: ${{ steps.changes.outputs.db }}
          FULL: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          FORCE_API: ${{ github.event_name == 'workflow_dispatch' && inputs.force_api_build == true }}
          FORCE_WEB: ${{ github.event_name == 'workflow_dispatch' && inputs.force_web_build == true }}
        run: |
          # refs/heads/main (non-PR) forces the full check matrix and both
          # image builds. Elsewhere the raw path filters apply, and a
          # workflow-dispatch force input only ever adds a build: a false
          # input never forces anything.
          resolve() {
            if [ "$FULL" = "true" ] || [ "$1" = "true" ] || [ "$2" = "true" ]; then
              echo "true"
            else
              echo "false"
            fi
          }
          {
            echo "full=$FULL"
            echo "node=$(resolve "$RAW_NODE" false)"
            echo "api=$(resolve "$RAW_API" "$FORCE_API")"
            echo "web=$(resolve "$RAW_WEB" "$FORCE_WEB")"
            echo "agent=$(resolve "$RAW_AGENT" false)"
            echo "installer=$(resolve "$RAW_INSTALLER" false)"
            echo "updater=$(resolve "$RAW_UPDATER" false)"
            echo "db=$(resolve "$RAW_DB" false)"
          } >> "$GITHUB_OUTPUT"

  verify-checks:
    name: Verify checks
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.node == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Node dependencies
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.node == 'true'
        run: npm ci

      - name: Setup Go for rotation protocol tests
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.node == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache-dependency-path: packages/agent/go.mod

      - name: Build local agent rotation client for Node tests
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.node == 'true'
        working-directory: packages/agent
        run: go build -o dist/local-agent-rotator ./cmd/local-agent-rotator

      - name: Run Node tests
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.node == 'true'
        run: npm test

      - name: Typecheck Node workspaces
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.node == 'true'
        run: npm run typecheck

      - name: Build Node app
        # Fallback compile check when no Docker target builds; scheduled
        # API/Web image builds compile their respective workspaces.
        if: needs.changes.outputs.node == 'true' && needs.changes.outputs.api != 'true' && needs.changes.outputs.web != 'true'
        run: npm run build

      - name: Smoke test scripts (--help exits 0, no env required)
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.node == 'true'
        run: |
          npx tsx scripts/agent/create-agent-token.ts --help
          npx tsx scripts/agent/install-agent-from-env.ts --help

  verify-go:
    name: Verify Go checks
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js for updater validation
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.updater == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate installer hardening
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.installer == 'true'
        run: bash scripts/tests/test-installer-docker-access.sh

      - name: Setup Go
        # Pinned ahead of the updater check so its scoped Go verification
        # (vet/test/GOOS=linux build) and the agent race/vet tests share one
        # cached toolchain instead of the runner's preinstalled Go.
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.agent == 'true' || needs.changes.outputs.updater == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache-dependency-path: packages/agent/go.mod

      - name: Validate updater bootstrap and unit hardening
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.updater == 'true'
        run: bash scripts/tests/test-updater.sh

      - name: Validate Docker Compose configuration
        env:
          POSTGRES_PASSWORD: ci-compose-password
          DASHBOARD_SESSION_SECRET: ci-compose-session-secret-012345678901234567890123
        run: docker compose config --quiet

      - name: Test Go agent with race detector
        # Race + vet: release binaries are compiled by the API image build.
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.agent == 'true'
        run: |
          if ! command -v gcc >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y gcc
          fi
          cd packages/agent
          CGO_ENABLED=1 go test -race ./...
          go vet ./...

  verify:
    name: Verify
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      actions: read
      packages: write
      contents: read
    outputs:
      api_image: ${{ steps.meta.outputs.api_image }}
      api_sha_tag: ${{ steps.meta.outputs.api_sha_tag }}
      web_image: ${{ steps.meta.outputs.web_image }}
      web_sha_tag: ${{ steps.meta.outputs.web_sha_tag }}
      api_digest: ${{ steps.push.outputs.api_digest }}
      web_digest: ${{ steps.push.outputs.web_digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        # Pinned when either image builds: the Trivy critical findings gate
        # runs `node` without npm dependencies.
        if: needs.changes.outputs.api == 'true' || needs.changes.outputs.web == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Docker Buildx
        if: needs.changes.outputs.api == 'true' || needs.changes.outputs.web == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build pinned AI rootfs artifacts
        # The API image bundles the AI sandbox rootfs tarballs and manifests.
        # They must be built before `docker build` (the script extracts a
        # pinned, digest-verified busybox via Docker, so it cannot run inside
        # the Dockerfile) and are COPYed by the Dockerfile from the build
        # context under packages/agent/dist. The script fails closed if Docker
        # is unavailable or the busybox digests do not verify.
        id: ai-rootfs
        if: needs.changes.outputs.api == 'true'
        run: |
          node scripts/agent/build-rootfs.mjs packages/agent/dist linux-amd64
          node scripts/agent/build-rootfs.mjs packages/agent/dist linux-arm64

      - name: Build API Docker image
        id: api-build
        if: needs.changes.outputs.api == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: api-runtime
          push: false
          load: true
          tags: vps-manager-nodejs-api:ci
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=vps-manager-nodejs-api
          cache-from: type=gha,scope=api-runtime
          cache-to: type=gha,mode=max,scope=api-runtime

      - name: Smoke test API runtime migration assets, agent binary, and AI bundle
        # `set -eu` makes the shell abort on the first failed assertion so a
        # missing asset can never be masked by a later passing check. The AI
        # bundle asserts pin the exact file names AiBundleService requires
        # (packages/api/src/ai/ai-bundle.service.ts): any missing or misnamed
        # artifact would make the dashboard report "AI bundle incomplete".
        if: needs.changes.outputs.api == 'true'
        run: |
          docker run --rm --entrypoint sh vps-manager-nodejs-api:ci -lc '
            set -eu
            test -f /app/dist/db/migrate.js
            test -f /app/dist/scripts/set-dashboard-password.js
            test -f /app/db/migrations/001_core_schema.sql
            test -f /app/db/migrations/002_metric_indexes.sql
            test -f /app/db/migrations/003_timescale_optional.sql
            test -f /app/db/migrations/004_dashboard_sessions.sql
            test -f /app/db/migrations/005_dashboard_admin_credentials.sql
            test -f /app/db/migrations/006_rate_limit_buckets.sql
            test -f /app/db/migrations/007_local_host_fields.sql
            test -f /app/db/migrations/008_system_info.sql
            test -f /app/db/migrations/009_docker_metrics.sql
            test -f /app/db/migrations/010_ssh_host_key_pins.sql
            test -f /app/db/migrations/011_vps_display_name.sql
            test -f /app/db/migrations/012_vps_location.sql
            test -f /app/db/migrations/013_docker_monitoring.sql
            test -f /app/db/migrations/014_docker_ingest.sql
            test -f /app/db/migrations/015_docker_metric_rollup_metric_name.sql
            test -f /app/db/migrations/016_docker_alert_resolution.sql
            test -x /app/agent/vps-agent-linux-amd64
            test -x /app/agent/vps-updater-linux-amd64

            # AI sandbox bundle under /app/agent/ai: required file names for
            # BOTH architectures (rootfs tarball + manifest, executor and
            # host helper binaries), the installer script, and a non-empty
            # profiles directory. A missing or misnamed file makes the
            # runtime report "AI bundle incomplete" (ai-bundle.service.ts).
            test -f /app/agent/ai/ai-rootfs-linux-amd64.tar.gz
            test -f /app/agent/ai/ai-rootfs-linux-amd64.manifest.json
            test -f /app/agent/ai/ai-rootfs-linux-arm64.tar.gz
            test -f /app/agent/ai/ai-rootfs-linux-arm64.manifest.json
            test -x /app/agent/ai/ai-executor-linux-amd64
            test -x /app/agent/ai/ai-executor-linux-arm64
            test -x /app/agent/ai/ai-host-helper-linux-amd64
            test -x /app/agent/ai/ai-host-helper-linux-arm64
            test -x /app/agent/ai/install-local-agent.sh
            set -- /app/agent/ai/profiles/*
            test -f "$1"
          '

          # Bundle integrity: each rootfs manifest must parse, declare a
          # 64-hex rootfsSha256 with at least one file entry, and its digest
          # must match the sibling tarball so a stale or mispaired bundle
          # cannot ship (the same failure class as "AI bundle incomplete").
          docker run --rm --entrypoint node vps-manager-nodejs-api:ci -e '
            const fs = require("node:fs");
            const crypto = require("node:crypto");
            const dir = "/app/agent/ai";
            for (const arch of ["amd64", "arm64"]) {
              const manifest = JSON.parse(fs.readFileSync(`${dir}/ai-rootfs-linux-${arch}.manifest.json`, "utf8"));
              if (manifest.version !== 1) {
                throw new Error(`${arch}: unexpected rootfs manifest version ${manifest.version}`);
              }
              if (!Array.isArray(manifest.files) || manifest.files.length === 0) {
                throw new Error(`${arch}: rootfs manifest lists no files`);
              }
              if (typeof manifest.rootfsSha256 !== "string" || !/^[0-9a-f]{64}$/.test(manifest.rootfsSha256)) {
                throw new Error(`${arch}: manifest rootfsSha256 is not a 64-hex digest`);
              }
              const tarballSha256 = crypto.createHash("sha256")
                .update(fs.readFileSync(`${dir}/ai-rootfs-linux-${arch}.tar.gz`))
                .digest("hex");
              if (tarballSha256 !== manifest.rootfsSha256) {
                throw new Error(`${arch}: rootfs tarball sha256 does not match manifest rootfsSha256`);
              }
              console.log(`AI rootfs manifest OK: ${arch} (${manifest.files.length} files, sha256=${tarballSha256.slice(0, 12)}...)`);
            }
          '

      - name: Verify embedded agent and updater identity
        # Direct -version checks on the embedded binaries inside the API image.
        # Validates that both the agent and updater binaries built into the image
        # share the same canonical content identity matching VERSION+40-hex.
        if: needs.changes.outputs.api == 'true'
        run: |
          AGENT_ID="$(docker run --rm --entrypoint /app/agent/vps-agent-linux-amd64 vps-manager-nodejs-api:ci -version)"
          UPDATER_ID="$(docker run --rm --entrypoint /app/agent/vps-updater-linux-amd64 vps-manager-nodejs-api:ci -version)"
          echo "agent:    $AGENT_ID"
          echo "updater:  $UPDATER_ID"
          test "$AGENT_ID" = "$UPDATER_ID"
          echo "$AGENT_ID" | grep -Eq "^dev\+[0-9a-f]{40}$"
          echo "embedded binary identity OK: $AGENT_ID"

      - name: Build web Docker image
        id: web-build
        if: needs.changes.outputs.web == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web-runtime
          push: false
          load: true
          tags: vps-manager-nodejs-web:ci
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=vps-manager-nodejs-web
          cache-from: type=gha,scope=web-runtime
          cache-to: type=gha,mode=max,scope=web-runtime

      - name: Assert no Docker socket on Compose surfaces
        # Primary guard: the socket is mounted at *run* time via Compose, not
        # baked into image config, so check the surfaces that can mount it:
        # rendered repo compose, install.sh template, deploy heredoc.
        run: bash scripts/tests/check-no-docker-socket.sh

      - name: Assert no Docker socket in built image metadata (supplemental)
        # Supplemental only: image config cannot carry a host bind-mount, but
        # keep this as defense-in-depth alongside the Compose-surface guard.
        if: needs.changes.outputs.api == 'true' || needs.changes.outputs.web == 'true'
        run: |
          check_image() {
            image="$1"
            if docker inspect "$image" --format '{{json .Config.Volumes}} {{json .Config.Entrypoint}} {{json .Config.Cmd}}' | grep -qiE 'docker\.sock|/var/run/docker|/run/docker\.sock'; then
              echo "FAIL: image $image references the Docker socket." >&2
              exit 1
            fi
          }
          if [ "${{ needs.changes.outputs.api }}" = "true" ]; then
            check_image vps-manager-nodejs-api:ci
          fi
          if [ "${{ needs.changes.outputs.web }}" = "true" ]; then
            check_image vps-manager-nodejs-web:ci
          fi
          echo "No Docker socket references in built API/web image metadata."

      - name: Setup Trivy
        # Pin same Trivy version as aquasecurity/trivy-action@v0.36.0 (v0.70.0).
        if: |
          (success() || failure()) && (
            (needs.changes.outputs.api == 'true' && steps['api-build'].outcome == 'success') ||
            (needs.changes.outputs.web == 'true' && steps['web-build'].outcome == 'success')
          )
        uses: aquasecurity/setup-trivy@v0.2.6
        with:
          version: v0.70.0
          cache: true

      - name: Scan built images for critical fixable vulnerabilities
        # Run API and web Trivy scans concurrently using background subprocesses.
        # Prefetch the DB first to prevent concurrent DB download races, then run
        # scans with --skip-db-update.
        # Both scans run independently to completion even if one fails. Exit codes
        # are surfaced, and reports are gated fail-closed by gate-trivy-critical.mjs.
        # Scan only images successfully built in this job; never trigger registry fallback.
        if: |
          (success() || failure()) && (
            (needs.changes.outputs.api == 'true' && steps['api-build'].outcome == 'success') ||
            (needs.changes.outputs.web == 'true' && steps['web-build'].outcome == 'success')
          )
        env:
          SCAN_API: ${{ needs.changes.outputs.api == 'true' && steps['api-build'].outcome == 'success' }}
          SCAN_WEB: ${{ needs.changes.outputs.web == 'true' && steps['web-build'].outcome == 'success' }}
        run: |
          echo "Prefetching Trivy vulnerability database..."
          trivy image --download-db-only

          pid_api=""
          pid_web=""

          if [ "$SCAN_API" = "true" ]; then
            echo "Starting parallel Trivy scan for API image..."
            trivy image \
              --format json \
              --output trivy-api-results.json \
              --severity CRITICAL \
              --scanners vuln \
              --ignore-unfixed \
              --exit-code 0 \
              --cache-backend memory \
              --skip-db-update \
              vps-manager-nodejs-api:ci &
            pid_api=$!
          fi

          if [ "$SCAN_WEB" = "true" ]; then
            echo "Starting parallel Trivy scan for web image..."
            trivy image \
              --format json \
              --output trivy-web-results.json \
              --severity CRITICAL \
              --scanners vuln \
              --ignore-unfixed \
              --exit-code 0 \
              --cache-backend memory \
              --skip-db-update \
              vps-manager-nodejs-web:ci &
            pid_web=$!
          fi

          status_api=0
          status_web=0

          if [ -n "$pid_api" ]; then
            wait "$pid_api" || status_api=$?
            echo "API image Trivy scan finished with exit code: $status_api"
          fi

          if [ -n "$pid_web" ]; then
            wait "$pid_web" || status_web=$?
            echo "Web image Trivy scan finished with exit code: $status_web"
          fi

          if [ "$status_api" -ne 0 ] || [ "$status_web" -ne 0 ]; then
            echo "Error: One or more Trivy scans failed (API: $status_api, Web: $status_web)." >&2
            exit 1
          fi

      - name: Generate SBOM for API image
        # SBOMs are release attestations: generate them only on runs that can
        # publish (non-PR main). Trivy scans and the gate still cover PRs.
        if: (success() || failure()) && needs.changes.outputs.api == 'true' && steps['api-build'].outcome == 'success' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: anchore/sbom-action@v0
        with:
          image: vps-manager-nodejs-api:ci
          format: spdx-json
          output-file: sbom-api.spdx.json

      - name: Generate SBOM for web image
        if: (success() || failure()) && needs.changes.outputs.web == 'true' && steps['web-build'].outcome == 'success' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: anchore/sbom-action@v0
        with:
          image: vps-manager-nodejs-web:ci
          format: spdx-json
          output-file: sbom-web.spdx.json

      - name: Upload security artifacts
        if: always() && (needs.changes.outputs.api == 'true' || needs.changes.outputs.web == 'true')
        uses: actions/upload-artifact@v4
        with:
          name: image-security-${{ github.sha }}
          path: |
            trivy-api-results.json
            trivy-web-results.json
            sbom-api.spdx.json
            sbom-web.spdx.json
          if-no-files-found: warn
          retention-days: 30

      - name: Gate on fixable CRITICAL findings
        # Explicit fail-closed gate after artifacts upload: both report-only
        # scans/SBOMs complete first (exit-code 0 + always()), then this step
        # fails the job if either report contains a fixable CRITICAL finding.
        # Always run and assert the expected reports exist so a skipped or
        # missing scan can never silently pass the release gate.
        if: always() && (needs.changes.outputs.api == 'true' || needs.changes.outputs.web == 'true')
        env:
          EXPECT_API: ${{ needs.changes.outputs.api }}
          EXPECT_WEB: ${{ needs.changes.outputs.web }}
        run: |
          normalize() { [ "$1" = "true" ] && echo 1 || echo 0; }
          EXPECT_API="$(normalize "$EXPECT_API")" EXPECT_WEB="$(normalize "$EXPECT_WEB")" node scripts/ci/gate-trivy-critical.mjs

      - name: Capture scanned image IDs
        # Capture local scanned image IDs before waiting and tagging/pushing so
        # we can assert the exact same daemon images are published without mutation.
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.changes.outputs.full == 'true'
        id: scanned-images
        run: |
          set -eu
          SCANNED_API_ID="$(docker image inspect --format '{{.Id}}' vps-manager-nodejs-api:ci)"
          SCANNED_WEB_ID="$(docker image inspect --format '{{.Id}}' vps-manager-nodejs-web:ci)"
          test -n "$SCANNED_API_ID"
          test -n "$SCANNED_WEB_ID"
          {
            echo "api_id=$SCANNED_API_ID"
            echo "web_id=$SCANNED_WEB_ID"
          } >> "$GITHUB_OUTPUT"
          echo "Scanned image IDs: API=$SCANNED_API_ID WEB=$SCANNED_WEB_ID"

      - name: Wait for peer release checks
        # Poll current run attempt jobs endpoint for the four required peer jobs:
        # Verify checks, Verify Go checks, TimescaleDB PostgreSQL migration integration,
        # Docker monitoring PostgreSQL 16. Fails closed on any non-success conclusion,
        # missing job at timeout, duplicate, or cancellation.
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.changes.outputs.full == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/wait-release-checks.mjs

      - name: Docker metadata
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.changes.outputs.full == 'true'
        id: meta
        # Every main run publishes BOTH images pinned to the current commit
        # SHA, even when path filters saw no change. The images are the exact
        # ones built, scanned, and gated in verify on this same runner. SHA tags
        # stay immutable and rollback-reproducible (redeploy a prior SHA tag);
        # deploy pulls the digest references recorded after the push.
        run: |
          set -eu
          BASE_IMAGE="${IMAGE_NAME,,}"
          API_IMAGE="${BASE_IMAGE}-api"
          WEB_IMAGE="${BASE_IMAGE}-web"
          API_SHA_TAG="$API_IMAGE:${GITHUB_SHA}"
          WEB_SHA_TAG="$WEB_IMAGE:${GITHUB_SHA}"
          {
            echo "api_image=$API_IMAGE"
            echo "api_sha_tag=$API_SHA_TAG"
            echo "web_image=$WEB_IMAGE"
            echo "web_sha_tag=$WEB_SHA_TAG"
          } >> "$GITHUB_OUTPUT"
          {
            echo "API_IMAGE=$API_IMAGE"
            echo "API_SHA_TAG=$API_SHA_TAG"
            echo "WEB_IMAGE=$WEB_IMAGE"
            echo "WEB_SHA_TAG=$WEB_SHA_TAG"
          } >> "$GITHUB_ENV"

      - name: Login to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.changes.outputs.full == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Tag and push verified images
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.changes.outputs.full == 'true'
        id: push
        run: |
          set -eu
          CURRENT_API_ID="$(docker image inspect --format '{{.Id}}' vps-manager-nodejs-api:ci)"
          CURRENT_WEB_ID="$(docker image inspect --format '{{.Id}}' vps-manager-nodejs-web:ci)"
          test "$CURRENT_API_ID" = "${{ steps.scanned-images.outputs.api_id }}"
          test "$CURRENT_WEB_ID" = "${{ steps.scanned-images.outputs.web_id }}"
          echo "Daemon images match scanned images: API=$CURRENT_API_ID WEB=$CURRENT_WEB_ID"

          docker tag vps-manager-nodejs-api:ci "$API_SHA_TAG"
          docker tag vps-manager-nodejs-web:ci "$WEB_SHA_TAG"

          # Push API and web images concurrently with explicit wait statuses
          docker push "$API_SHA_TAG" &
          pid_api=$!
          docker push "$WEB_SHA_TAG" &
          pid_web=$!

          status_api=0
          status_web=0
          wait "$pid_api" || status_api=$?
          wait "$pid_web" || status_web=$?

          if [ "$status_api" -ne 0 ] || [ "$status_web" -ne 0 ]; then
            echo "Error: One or more image pushes failed (API: $status_api, Web: $status_web)." >&2
            exit 1
          fi

          # RepoDigests exists only after the push; record the immutable
          # name@digest references that deploy pulls by.
          API_DIGEST="$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$API_SHA_TAG" | grep -F "$API_IMAGE@" | head -n 1)"
          WEB_DIGEST="$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$WEB_SHA_TAG" | grep -F "$WEB_IMAGE@" | head -n 1)"
          test -n "$API_DIGEST"
          test -n "$WEB_DIGEST"
          {
            echo "api_digest=$API_DIGEST"
            echo "web_digest=$WEB_DIGEST"
          } >> "$GITHUB_OUTPUT"
          echo "pushed $API_SHA_TAG -> $API_DIGEST"
          echo "pushed $WEB_SHA_TAG -> $WEB_DIGEST"

  postgres-integration:
    name: TimescaleDB PostgreSQL migration integration
    # Runs concurrently with verify, verify-checks, and verify-go: only change detection gates it.
    needs: changes
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.db == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:2.17.2-pg16
        env:
          POSTGRES_DB: vps_manager
          POSTGRES_USER: vps_manager
          POSTGRES_PASSWORD: vps_manager
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vps_manager -d vps_manager"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install Node dependencies
        run: npm ci
      - name: Run PostgreSQL migration tests
        env:
          VPS_MANAGER_TEST_POSTGRES_URL: postgres://vps_manager:vps_manager@localhost:5432/vps_manager
        run: npx vitest run packages/api/tests/docker-migration-009.postgres.test.ts packages/api/tests/docker-migration-013.postgres.test.ts packages/api/tests/docker-migration-014.postgres.test.ts packages/api/tests/docker-monitoring-repository.postgres.test.ts packages/api/tests/docker-monitoring-maintenance.postgres.test.ts packages/api/tests/ai-key-admin.postgres.test.ts packages/api/tests/agent-convergence.service.test.ts

  docker-monitoring-postgres16:
    name: Docker monitoring PostgreSQL 16
    needs: changes
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.db == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: vps_manager
          POSTGRES_USER: vps_manager
          POSTGRES_PASSWORD: vps_manager
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vps_manager -d vps_manager"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install Node dependencies
        run: npm ci
      - name: Run Docker monitoring PostgreSQL 16 tests
        env:
          VPS_MANAGER_TEST_POSTGRES_URL: postgres://vps_manager:vps_manager@localhost:5432/vps_manager
        run: npx vitest run packages/api/tests/docker-migration-009.postgres.test.ts packages/api/tests/docker-migration-013.postgres.test.ts packages/api/tests/docker-migration-014.postgres.test.ts packages/api/tests/docker-monitoring-repository.postgres.test.ts packages/api/tests/docker-monitoring-maintenance.postgres.test.ts packages/api/tests/ai-key-admin.postgres.test.ts packages/api/tests/agent-convergence.service.test.ts

  deploy:
    name: Deploy over SSH
    needs: [verify, e2e]
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: read
    environment: production
    steps:
      - name: Check deploy configuration
        id: config
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          if [ -n "$VPS_HOST" ] && [ -n "$VPS_USER" ] && [ -n "$VPS_SSH_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Deploy skipped: set VPS_HOST, VPS_USER and VPS_SSH_KEY repository secrets to enable SSH deployment."
          fi
          echo "deploy_path=${DEPLOY_PATH:-/opt/vps-manager-nodejs}" >> "$GITHUB_OUTPUT"

      - name: Checkout installer assets
        if: steps.config.outputs.enabled == 'true'
        uses: actions/checkout@v4

      - name: Prepare SSH key
        if: steps.config.outputs.enabled == 'true'
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Add server host key
        if: steps.config.outputs.enabled == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          if [ -n "$VPS_KNOWN_HOSTS" ]; then
            printf '%s\n' "$VPS_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          else
            echo "WARNING: VPS_KNOWN_HOSTS secret not set — using ssh-keyscan (TOFU)."
            echo "Set VPS_KNOWN_HOSTS to a pinned known_hosts entry for production."
            ssh-keyscan -p "${VPS_PORT:-22}" -H "$VPS_HOST" >> ~/.ssh/known_hosts
          fi

      - name: Deploy container
        if: steps.config.outputs.enabled == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          DEPLOY_PATH: ${{ steps.config.outputs.deploy_path }}
          API_IMAGE: ${{ needs.verify.outputs.api_digest }}
          WEB_IMAGE: ${{ needs.verify.outputs.web_digest }}
          DASHBOARD_SESSION_SECRET: ${{ secrets.DASHBOARD_SESSION_SECRET }}
          DASHBOARD_ADMIN_PASSWORD: ${{ secrets.DASHBOARD_ADMIN_PASSWORD }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          APP_PORT: ${{ vars.PORT }}
          APP_MODE_VALUE: ${{ vars.APP_MODE }}
          ENABLE_WEB_TERMINAL_VALUE: ${{ vars.ENABLE_WEB_TERMINAL }}
          ALLOW_PRIVATE_NETWORK_TARGETS_VALUE: ${{ vars.ALLOW_PRIVATE_NETWORK_TARGETS }}
          DATA_DIR_VALUE: ${{ vars.DATA_DIR }}
          PRIVATE_DIR_VALUE: ${{ vars.PRIVATE_DIR }}
          RATE_LIMIT_WINDOW_MS_VALUE: ${{ vars.RATE_LIMIT_WINDOW_MS }}
          RATE_LIMIT_MAX_VALUE: ${{ vars.RATE_LIMIT_MAX }}
          AGENT_PUBLIC_BASE_URL_VALUE: ${{ vars.AGENT_PUBLIC_BASE_URL }}
          ALLOW_INSECURE_AGENT_HTTP_VALUE: ${{ vars.ALLOW_INSECURE_AGENT_HTTP }}
          AGENT_RELEASE_PUBLIC_KEY_VALUE: ${{ vars.AGENT_RELEASE_PUBLIC_KEY }}
          AGENT_RELEASE_MANIFEST_URL_VALUE: ${{ vars.AGENT_RELEASE_MANIFEST_URL }}
          FLEET_RELEASE_PUBLIC_KEY_FILE_VALUE: ${{ vars.FLEET_RELEASE_PUBLIC_KEY_FILE }}
          FLEET_RELEASE_MANIFEST_URL_VALUE: ${{ vars.FLEET_RELEASE_MANIFEST_URL }}
          DASHBOARD_SESSION_TTL_SECONDS_VALUE: ${{ vars.DASHBOARD_SESSION_TTL_SECONDS }}
          DASHBOARD_PUBLIC_ORIGIN_VALUE: ${{ vars.DASHBOARD_PUBLIC_ORIGIN }}
          DASHBOARD_COOKIE_SECURE_VALUE: ${{ vars.DASHBOARD_COOKIE_SECURE }}
          DASHBOARD_COOKIE_SAME_SITE_VALUE: ${{ vars.DASHBOARD_COOKIE_SAME_SITE }}
          TRUST_PROXY_HOPS_VALUE: ${{ vars.TRUST_PROXY_HOPS }}
          TERMINAL_GLOBAL_LIMIT_VALUE: ${{ vars.TERMINAL_GLOBAL_LIMIT }}
          TERMINAL_DASHBOARD_LIMIT_VALUE: ${{ vars.TERMINAL_DASHBOARD_LIMIT }}
          TERMINAL_VPS_LIMIT_VALUE: ${{ vars.TERMINAL_VPS_LIMIT }}
          TERMINAL_PENDING_LIMIT_VALUE: ${{ vars.TERMINAL_PENDING_LIMIT }}
          TERMINAL_OPEN_TIMEOUT_MS_VALUE: ${{ vars.TERMINAL_OPEN_TIMEOUT_MS }}
          TERMINAL_IDLE_TIMEOUT_MS_VALUE: ${{ vars.TERMINAL_IDLE_TIMEOUT_MS }}
          TERMINAL_LIFETIME_MS_VALUE: ${{ vars.TERMINAL_LIFETIME_MS }}
          TERMINAL_REVOCATION_POLL_MS_VALUE: ${{ vars.TERMINAL_REVOCATION_POLL_MS }}
          TERMINAL_HEARTBEAT_MS_VALUE: ${{ vars.TERMINAL_HEARTBEAT_MS }}
          TERMINAL_OUTPUT_BUFFER_BYTES_VALUE: ${{ vars.TERMINAL_OUTPUT_BUFFER_BYTES }}
          TERMINAL_INPUT_BUFFER_BYTES_VALUE: ${{ vars.TERMINAL_INPUT_BUFFER_BYTES }}
          TERMINAL_SLOW_CONSUMER_TIMEOUT_MS_VALUE: ${{ vars.TERMINAL_SLOW_CONSUMER_TIMEOUT_MS }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$POSTGRES_PASSWORD" ]; then
            echo "POSTGRES_PASSWORD repository secret is required for production deployment."
            exit 1
          fi
          if [ -z "$DASHBOARD_SESSION_SECRET" ]; then
            echo "DASHBOARD_SESSION_SECRET repository secret is required for production deployment (APP_MODE=local)."
            exit 1
          fi
          DASHBOARD_SESSION_SECRET_ONE_LINE="$(printf '%s' "$DASHBOARD_SESSION_SECRET" | tr -d '\r\n')"
          POSTGRES_PASSWORD_ONE_LINE="$(printf '%s' "$POSTGRES_PASSWORD" | tr -d '\r\n')"
          APP_PORT="${APP_PORT:-3000}"
          APP_MODE_VALUE="${APP_MODE_VALUE:-local}"
          ENABLE_WEB_TERMINAL_VALUE="${ENABLE_WEB_TERMINAL_VALUE:-false}"
          ALLOW_PRIVATE_NETWORK_TARGETS_VALUE="${ALLOW_PRIVATE_NETWORK_TARGETS_VALUE:-false}"
          DATA_DIR_VALUE="${DATA_DIR_VALUE:-data}"
          PRIVATE_DIR_VALUE="${PRIVATE_DIR_VALUE:-private}"
          RATE_LIMIT_WINDOW_MS_VALUE="${RATE_LIMIT_WINDOW_MS_VALUE:-60000}"
          RATE_LIMIT_MAX_VALUE="${RATE_LIMIT_MAX_VALUE:-120}"
          ALLOW_INSECURE_AGENT_HTTP_VALUE="${ALLOW_INSECURE_AGENT_HTTP_VALUE:-false}"
          AGENT_RELEASE_PUBLIC_KEY_VALUE="${AGENT_RELEASE_PUBLIC_KEY_VALUE:-}"
          AGENT_RELEASE_MANIFEST_URL_VALUE="${AGENT_RELEASE_MANIFEST_URL_VALUE:-}"
          FLEET_RELEASE_PUBLIC_KEY_FILE_VALUE="${FLEET_RELEASE_PUBLIC_KEY_FILE_VALUE:-}"
          FLEET_RELEASE_MANIFEST_URL_VALUE="${FLEET_RELEASE_MANIFEST_URL_VALUE:-}"
          DASHBOARD_SESSION_TTL_SECONDS_VALUE="${DASHBOARD_SESSION_TTL_SECONDS_VALUE:-28800}"
          DASHBOARD_PUBLIC_ORIGIN_VALUE="${DASHBOARD_PUBLIC_ORIGIN_VALUE:-}"
          DASHBOARD_COOKIE_SECURE_VALUE="${DASHBOARD_COOKIE_SECURE_VALUE:-true}"
          DASHBOARD_COOKIE_SAME_SITE_VALUE="${DASHBOARD_COOKIE_SAME_SITE_VALUE:-lax}"
          TRUST_PROXY_HOPS_VALUE="${TRUST_PROXY_HOPS_VALUE:-0}"
          TERMINAL_GLOBAL_LIMIT_VALUE="${TERMINAL_GLOBAL_LIMIT_VALUE:-10}"
          TERMINAL_DASHBOARD_LIMIT_VALUE="${TERMINAL_DASHBOARD_LIMIT_VALUE:-3}"
          TERMINAL_VPS_LIMIT_VALUE="${TERMINAL_VPS_LIMIT_VALUE:-2}"
          TERMINAL_PENDING_LIMIT_VALUE="${TERMINAL_PENDING_LIMIT_VALUE:-10}"
          TERMINAL_OPEN_TIMEOUT_MS_VALUE="${TERMINAL_OPEN_TIMEOUT_MS_VALUE:-10000}"
          TERMINAL_IDLE_TIMEOUT_MS_VALUE="${TERMINAL_IDLE_TIMEOUT_MS_VALUE:-900000}"
          TERMINAL_LIFETIME_MS_VALUE="${TERMINAL_LIFETIME_MS_VALUE:-7200000}"
          TERMINAL_REVOCATION_POLL_MS_VALUE="${TERMINAL_REVOCATION_POLL_MS_VALUE:-5000}"
          TERMINAL_HEARTBEAT_MS_VALUE="${TERMINAL_HEARTBEAT_MS_VALUE:-30000}"
          TERMINAL_OUTPUT_BUFFER_BYTES_VALUE="${TERMINAL_OUTPUT_BUFFER_BYTES_VALUE:-1048576}"
          TERMINAL_INPUT_BUFFER_BYTES_VALUE="${TERMINAL_INPUT_BUFFER_BYTES_VALUE:-65536}"
          TERMINAL_SLOW_CONSUMER_TIMEOUT_MS_VALUE="${TERMINAL_SLOW_CONSUMER_TIMEOUT_MS_VALUE:-10000}"
          APP_AI_ENABLED_VALUE="${APP_AI_ENABLED_VALUE:-true}"

          SSH_OPTS=(
            -i ~/.ssh/deploy_key
            -p "${VPS_PORT:-22}"
            -o BatchMode=yes
            -o ConnectTimeout=20
            -o ConnectionAttempts=3
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=4
            -o ControlMaster=auto
            -o ControlPersist=10m
            -o ControlPath="$HOME/.ssh/deploy-%C"
          )
          SSH_BASE=(ssh "${SSH_OPTS[@]}" "${VPS_USER}@${VPS_HOST}")
          # Open one persistent control connection and reuse it for the deploy.
          # This avoids many short-lived SSH TCP handshakes that can trip
          # fail2ban/firewall rate limits on the production host.
          for attempt in 1 2 3; do
            if ssh "${SSH_OPTS[@]}" -fN "${VPS_USER}@${VPS_HOST}"; then
              break
            fi
            if [ "$attempt" = "3" ]; then
              exit 1
            fi
            echo "SSH control connection failed on attempt ${attempt}/3; retrying..." >&2
            sleep $((attempt * 10))
          done
          trap 'ssh "${SSH_OPTS[@]}" -O exit "${VPS_USER}@${VPS_HOST}" 2>/dev/null || true' EXIT
          ssh_retry() {
            local attempt
            for attempt in 1 2 3; do
              if "${SSH_BASE[@]}" "$@"; then
                return 0
              fi
              echo "SSH command failed on attempt ${attempt}/3; retrying..." >&2
              sleep $((attempt * 10))
            done
            return 1
          }
          SSH=ssh_retry
          printf '%s' "$GHCR_TOKEN" | $SSH "docker login ghcr.io -u '$GHCR_USER' --password-stdin"
          $SSH "mkdir -p '$DEPLOY_PATH'"
          $SSH "cat > '$DEPLOY_PATH/.env'" <<EOF
          PORT=$APP_PORT
          APP_MODE=$APP_MODE_VALUE
          DASHBOARD_SESSION_SECRET=$DASHBOARD_SESSION_SECRET_ONE_LINE
          DASHBOARD_SESSION_TTL_SECONDS=$DASHBOARD_SESSION_TTL_SECONDS_VALUE
          DASHBOARD_PUBLIC_ORIGIN=$DASHBOARD_PUBLIC_ORIGIN_VALUE
          DASHBOARD_COOKIE_SECURE=$DASHBOARD_COOKIE_SECURE_VALUE
          DASHBOARD_COOKIE_SAME_SITE=$DASHBOARD_COOKIE_SAME_SITE_VALUE
          ENABLE_WEB_TERMINAL=$ENABLE_WEB_TERMINAL_VALUE
          ALLOW_PRIVATE_NETWORK_TARGETS=$ALLOW_PRIVATE_NETWORK_TARGETS_VALUE
          DATA_DIR=$DATA_DIR_VALUE
          PRIVATE_DIR=$PRIVATE_DIR_VALUE
          RATE_LIMIT_WINDOW_MS=$RATE_LIMIT_WINDOW_MS_VALUE
          RATE_LIMIT_MAX=$RATE_LIMIT_MAX_VALUE
          AGENT_PUBLIC_BASE_URL=$AGENT_PUBLIC_BASE_URL_VALUE
          ALLOW_INSECURE_AGENT_HTTP=$ALLOW_INSECURE_AGENT_HTTP_VALUE
          AGENT_RELEASE_PUBLIC_KEY=$AGENT_RELEASE_PUBLIC_KEY_VALUE
          AGENT_RELEASE_MANIFEST_URL=$AGENT_RELEASE_MANIFEST_URL_VALUE
          FLEET_RELEASE_PUBLIC_KEY_FILE=$FLEET_RELEASE_PUBLIC_KEY_FILE_VALUE
          FLEET_RELEASE_MANIFEST_URL=$FLEET_RELEASE_MANIFEST_URL_VALUE
          TRUST_PROXY_HOPS=$TRUST_PROXY_HOPS_VALUE
          TERMINAL_GLOBAL_LIMIT=$TERMINAL_GLOBAL_LIMIT_VALUE
          TERMINAL_DASHBOARD_LIMIT=$TERMINAL_DASHBOARD_LIMIT_VALUE
          TERMINAL_VPS_LIMIT=$TERMINAL_VPS_LIMIT_VALUE
          TERMINAL_PENDING_LIMIT=$TERMINAL_PENDING_LIMIT_VALUE
          TERMINAL_OPEN_TIMEOUT_MS=$TERMINAL_OPEN_TIMEOUT_MS_VALUE
          TERMINAL_IDLE_TIMEOUT_MS=$TERMINAL_IDLE_TIMEOUT_MS_VALUE
          TERMINAL_LIFETIME_MS=$TERMINAL_LIFETIME_MS_VALUE
          TERMINAL_REVOCATION_POLL_MS=$TERMINAL_REVOCATION_POLL_MS_VALUE
          TERMINAL_HEARTBEAT_MS=$TERMINAL_HEARTBEAT_MS_VALUE
          TERMINAL_OUTPUT_BUFFER_BYTES=$TERMINAL_OUTPUT_BUFFER_BYTES_VALUE
          TERMINAL_INPUT_BUFFER_BYTES=$TERMINAL_INPUT_BUFFER_BYTES_VALUE
          TERMINAL_SLOW_CONSUMER_TIMEOUT_MS=$TERMINAL_SLOW_CONSUMER_TIMEOUT_MS_VALUE
          LOCAL_PTY_SOCKET_PATH=/var/run/flexserver/host-pty/host-pty.sock
          LOCAL_AGENT_ROTATION_HELPER=/usr/local/bin/local-agent-rotation-client
          LOCAL_AGENT_ROTATION_SOCKET=/var/run/flexserver/agent-rotation/agent-rotation.sock
          SSH_KEY_ENCRYPTION_KEY_FILE=/etc/flexserver/ssh-keyring.json
          AI_KEYRING_FILE=/etc/flexserver/ai-keyring.json
          APP_AI_ENABLED=$APP_AI_ENABLED_VALUE
          COMPOSE_KEYRING_FILE=/etc/flexserver/compose-keyring.json
          COMPOSE_CLAIM_LEASE_SECONDS=120
          COMPOSE_INVENTORY_MAX_BYTES=524288
          COMPOSE_PREVIEW_TTL_SECONDS=300
          STORAGE_DRIVER=postgres
          POSTGRES_DB=vps_manager
          POSTGRES_USER=vps_manager
          POSTGRES_PASSWORD=$POSTGRES_PASSWORD_ONE_LINE
          DATABASE_URL=postgres://vps_manager:$POSTGRES_PASSWORD_ONE_LINE@postgres:5432/vps_manager
          EOF
          $SSH "chmod 600 '$DEPLOY_PATH/.env'"
          $SSH "cat > '$DEPLOY_PATH/docker-compose.yml'" <<EOF
          services:
            postgres:
              image: timescale/timescaledb:2.17.2-pg16
              restart: unless-stopped
              env_file:
                - .env
              volumes:
                - vps-manager-postgres:/var/lib/postgresql/data
              healthcheck:
                test: ["CMD-SHELL", "pg_isready -U vps_manager -d vps_manager"]
                interval: 10s
                timeout: 5s
                retries: 5
                start_period: 10s
            api:
              image: $API_IMAGE
              restart: unless-stopped
              depends_on:
                postgres:
                  condition: service_healthy
              env_file:
                - .env
              environment:
                # Agent release catalog (opt-in). Key and pointer URL must be a
                # pair; both empty keeps it disabled, one-only fails the API
                # closed at startup. Never pass AGENT_RELEASE_SIGNING_KEY here.
                AGENT_RELEASE_PUBLIC_KEY: \${AGENT_RELEASE_PUBLIC_KEY:-}
                AGENT_RELEASE_MANIFEST_URL: \${AGENT_RELEASE_MANIFEST_URL:-}
                AGENT_RELEASE_TTL_SECONDS: \${AGENT_RELEASE_TTL_SECONDS:-300}
                FLEET_RELEASE_PUBLIC_KEY_FILE: \${FLEET_RELEASE_PUBLIC_KEY_FILE:-}
                FLEET_RELEASE_MANIFEST_URL: \${FLEET_RELEASE_MANIFEST_URL:-}
                LOCAL_PTY_SOCKET_PATH: \${LOCAL_PTY_SOCKET_PATH:-/var/run/flexserver/host-pty/host-pty.sock}
                LOCAL_AGENT_ROTATION_HELPER: \${LOCAL_AGENT_ROTATION_HELPER:-/usr/local/bin/local-agent-rotation-client}
                LOCAL_AGENT_ROTATION_SOCKET: \${LOCAL_AGENT_ROTATION_SOCKET:-/var/run/flexserver/agent-rotation/agent-rotation.sock}
                SSH_KEY_ENCRYPTION_KEY_FILE: \${SSH_KEY_ENCRYPTION_KEY_FILE:-/etc/flexserver/ssh-keyring.json}
                COMPOSE_KEYRING_FILE: \${COMPOSE_KEYRING_FILE:-/etc/flexserver/compose-keyring.json}
                AI_KEYRING_FILE: \${AI_KEYRING_FILE:-/etc/flexserver/ai-keyring.json}
                APP_AI_ENABLED: \${APP_AI_ENABLED:-true}
                COMPOSE_CLAIM_LEASE_SECONDS: \${COMPOSE_CLAIM_LEASE_SECONDS:-120}
                COMPOSE_INVENTORY_MAX_BYTES: \${COMPOSE_INVENTORY_MAX_BYTES:-524288}
                COMPOSE_PREVIEW_TTL_SECONDS: \${COMPOSE_PREVIEW_TTL_SECONDS:-300}
              volumes:
                - vps-manager-data:/app/data
                - vps-manager-private:/app/private
                - /var/run/flexserver:/var/run/flexserver
                - /etc/flexserver:/etc/flexserver:ro
              healthcheck:
                test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
                interval: 30s
                timeout: 5s
                retries: 3
                start_period: 10s
            web:
              image: $WEB_IMAGE
              restart: unless-stopped
              ports:
                - "127.0.0.1:3000:80"
              depends_on:
                api:
                  condition: service_healthy
              healthcheck:
                test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
                interval: 30s
                timeout: 5s
                retries: 3
                start_period: 5s
          volumes:
            vps-manager-data:
            vps-manager-private:
            vps-manager-postgres:
          EOF
          $SSH "cd '$DEPLOY_PATH' && docker compose pull"
          $SSH "cd '$DEPLOY_PATH' && docker compose up -d postgres"
          # Provision or upgrade host daemons and external SSH keyring from API image before starting API container
          echo "Provisioning host services and external SSH keyring from API image..."
          "${SSH_BASE[@]}" "
            set -euo pipefail
            SUDO=\"\"
            if [ \"\$(id -u)\" -ne 0 ]; then
              SUDO=\"sudo\"
            fi

            # Determine API container runtime UID/GID dynamically from the pulled image
            API_UID_GID=\"\$(docker run --rm --entrypoint sh '$API_IMAGE' -lc 'printf \"%s:%s\" \"\$(id -u)\" \"\$(id -g)\"')\"
            if [[ ! \"\$API_UID_GID\" =~ ^[0-9]+:[0-9]+$ ]]; then
              echo \"Error: Could not determine API container runtime UID/GID for $API_IMAGE.\" >&2
              exit 1
            fi
            API_UID=\"\${API_UID_GID%%:*}\"
            API_GID=\"\${API_UID_GID##*:}\"

            # Provision external SSH keyring directory (/etc/flexserver)
            KEYRING_DIR=\"/etc/flexserver\"
            KEYRING_FILE=\"\${KEYRING_DIR}/ssh-keyring.json\"

            sudo mkdir -p \"\$KEYRING_DIR\"
            sudo chown \"\${API_UID}:\${API_GID}\" \"\$KEYRING_DIR\"
            sudo chmod 0750 \"\$KEYRING_DIR\"

            if sudo test -f \"\$KEYRING_FILE\"; then
              echo \"Preserving existing SSH keyring at \$KEYRING_FILE.\"
              sudo chown \"\${API_UID}:\${API_GID}\" \"\$KEYRING_FILE\"
              sudo chmod 0600 \"\$KEYRING_FILE\"
            else
              echo \"Initializing external SSH key encryption keyring...\"
              cd '$DEPLOY_PATH' && docker compose run --rm --no-deps -v \"\${KEYRING_DIR}:\${KEYRING_DIR}:rw\" -e SSH_KEY_ENCRYPTION_KEY_FILE=\"\$KEYRING_FILE\" api node dist/scripts/manage-ssh-keys.js init --path \"\$KEYRING_FILE\"
              sudo chown \"\${API_UID}:\${API_GID}\" \"\$KEYRING_FILE\"
              sudo chmod 0600 \"\$KEYRING_FILE\"
            fi

            # Migrate managed SSH keys to envelope encryption
            echo \"Migrating managed SSH keys to envelope encryption...\"
            cd '$DEPLOY_PATH' && docker compose run --rm --no-deps -v \"\${KEYRING_DIR}:\${KEYRING_DIR}:ro\" -e SSH_KEY_ENCRYPTION_KEY_FILE=\"\$KEYRING_FILE\" api node dist/scripts/manage-ssh-keys.js migrate --path \"\$KEYRING_FILE\"
            # Retire both old shared-runtime units before creating isolated sockets.
            # Existing API mounts may refer to the old directory until Compose recreates it.
            \$SUDO systemctl stop flexserver-host-pty.service flexserver-local-agent-rotator.service || true
            # Extract packaged host-pty binary from API image
            HOST_PTY_TMP=\"\$(mktemp /tmp/host-pty-bundled.XXXXXX)\"
            if ! docker run --rm --entrypoint cat '$API_IMAGE' /app/agent/host-pty-linux-amd64 > \"\$HOST_PTY_TMP\" || [ ! -s \"\$HOST_PTY_TMP\" ]; then
              echo 'Error: Failed to extract bundled host-pty binary from API image.' >&2
              rm -f \"\$HOST_PTY_TMP\"
              exit 1
            fi
            chmod 0755 \"\$HOST_PTY_TMP\"

            # Atomic binary install into /usr/local/bin/flexserver-host-pty
            DEST=\"/usr/local/bin/flexserver-host-pty\"
            TMP_DEST=\"\${DEST}.tmp.\$\$\"
            \$SUDO cp -f \"\$HOST_PTY_TMP\" \"\$TMP_DEST\"
            \$SUDO chown root:root \"\$TMP_DEST\"
            \$SUDO chmod 0755 \"\$TMP_DEST\"
            \$SUDO mv -f \"\$TMP_DEST\" \"\$DEST\"
            rm -f \"\$HOST_PTY_TMP\"

            # Install systemd root daemon unit with RuntimeDirectory for boot directory recreation
            UNIT_FILE=\"/etc/systemd/system/flexserver-host-pty.service\"
            UNIT_TMP=\"\$(mktemp /tmp/flexserver-host-pty.XXXXXX.service)\"
            printf '[Unit]\nDescription=VPS Manager Host PTY Daemon\nDocumentation=https://github.com/sondoan17/vps-manager-nodejs\nAfter=network.target\n\n[Service]\nType=simple\nUser=root\nGroup=root\nRuntimeDirectory=flexserver/host-pty\nRuntimeDirectoryMode=0755\nExecStart=/usr/local/bin/flexserver-host-pty -socket /var/run/flexserver/host-pty/host-pty.sock -socket-mode 0660 -socket-uid %s -socket-gid %s\nRestart=always\nRestartSec=5\n\nProtectKernelTunables=true\nProtectKernelModules=true\nProtectClock=true\n\n[Install]\nWantedBy=multi-user.target\n' \"\$API_UID\" \"\$API_GID\" > \"\$UNIT_TMP\"
            \$SUDO chown root:root \"\$UNIT_TMP\"
            \$SUDO chmod 0644 \"\$UNIT_TMP\"
            \$SUDO mv -f \"\$UNIT_TMP\" \"\$UNIT_FILE\"

            # Enable and restart service so socket exists before API container starts
            \$SUDO systemctl daemon-reload
            \$SUDO systemctl enable flexserver-host-pty.service
            \$SUDO systemctl restart flexserver-host-pty.service
            echo \"Host PTY daemon started (socket: /var/run/flexserver/host-pty/host-pty.sock, uid=\${API_UID}, gid=\${API_GID}).\"

            # Extract packaged local-agent-rotator binary from API image
            ROTATOR_TMP=\"\$(mktemp /tmp/local-agent-rotator-bundled.XXXXXX)\"
            if ! docker run --rm --entrypoint cat '$API_IMAGE' /app/agent/local-agent-rotator-linux-amd64 > \"\$ROTATOR_TMP\" || [ ! -s \"\$ROTATOR_TMP\" ]; then
              echo 'Error: Failed to extract bundled local-agent-rotator binary from API image.' >&2
              rm -f \"\$ROTATOR_TMP\"
              exit 1
            fi
            chmod 0755 \"\$ROTATOR_TMP\"

            DEST=\"/usr/local/bin/flexserver-local-agent-rotator\"
            TMP_DEST=\"\${DEST}.tmp.\$\$\"
            \$SUDO cp -f \"\$ROTATOR_TMP\" \"\$TMP_DEST\"
            \$SUDO chown root:root \"\$TMP_DEST\"
            \$SUDO chmod 0755 \"\$TMP_DEST\"
            \$SUDO mv -f \"\$TMP_DEST\" \"\$DEST\"
            rm -f \"\$ROTATOR_TMP\"

            # Install systemd root daemon unit for rotation helper
            ROTATOR_UNIT_FILE=\"/etc/systemd/system/flexserver-local-agent-rotator.service\"
            ROTATOR_UNIT_TMP=\"\$(mktemp /tmp/flexserver-local-agent-rotator.XXXXXX.service)\"
            printf '[Unit]\nDescription=VPS Manager Local Agent Rotation Helper Daemon\nDocumentation=https://github.com/sondoan17/vps-manager-nodejs\nAfter=network.target\n\n[Service]\nType=simple\nUser=root\nGroup=root\nRuntimeDirectory=flexserver/agent-rotation\nRuntimeDirectoryMode=0755\nExecStart=/usr/local/bin/flexserver-local-agent-rotator -server -socket /var/run/flexserver/agent-rotation/agent-rotation.sock -socket-mode 0660 -socket-uid %s -socket-gid %s -config /etc/vps-manager-agent/config.json -service-name vps-manager-agent.service\nRestart=always\nRestartSec=5\n\nProtectKernelTunables=true\nProtectKernelModules=true\nProtectClock=true\n\n[Install]\nWantedBy=multi-user.target\n' \"\$API_UID\" \"\$API_GID\" > \"\$ROTATOR_UNIT_TMP\"
            \$SUDO chown root:root \"\$ROTATOR_UNIT_TMP\"
            \$SUDO chmod 0644 \"\$ROTATOR_UNIT_TMP\"
            \$SUDO mv -f \"\$ROTATOR_UNIT_TMP\" \"\$ROTATOR_UNIT_FILE\"
            \$SUDO systemctl daemon-reload
            \$SUDO systemctl enable flexserver-local-agent-rotator.service
            \$SUDO systemctl restart flexserver-local-agent-rotator.service
            echo \"Host Agent Rotator daemon started (socket: /var/run/flexserver/agent-rotation/agent-rotation.sock, uid=\${API_UID}, gid=\${API_GID}).\"

            # Provision the host-files helper using the packaged installer script
            # from the API image. The helper serves the same verb/path/body
            # contract as the Files API over a dedicated Unix socket owned by
            # the API runtime UID/GID; it never touches the container runtime.
            FILES_BIN_TMP=\"\$(mktemp /tmp/host-files-bundled.XXXXXX)\"
            FILES_SH_TMP=\"\$(mktemp /tmp/install-host-files.XXXXXX)\"
            if ! docker run --rm --entrypoint cat '$API_IMAGE' /app/agent/host-files-linux-amd64 > \"\$FILES_BIN_TMP\" || [ ! -s \"\$FILES_BIN_TMP\" ]; then
              echo 'Error: Failed to extract bundled host-files binary from API image.' >&2
              rm -f \"\$FILES_BIN_TMP\" \"\$FILES_SH_TMP\"
              exit 1
            fi
            chmod 0755 \"\$FILES_BIN_TMP\"
            if ! docker run --rm --entrypoint cat '$API_IMAGE' /app/scripts/install-host-files.sh > \"\$FILES_SH_TMP\" || [ ! -s \"\$FILES_SH_TMP\" ]; then
              echo 'Error: Failed to extract bundled install-host-files.sh from API image.' >&2
              rm -f \"\$FILES_BIN_TMP\" \"\$FILES_SH_TMP\"
              exit 1
            fi
            chmod 0755 \"\$FILES_SH_TMP\"
            \$SUDO bash \"\$FILES_SH_TMP\" --binary \"\$FILES_BIN_TMP\" --api-uid-gid \"\${API_UID}:\${API_GID}\"
            rm -f \"\$FILES_BIN_TMP\" \"\$FILES_SH_TMP\"
            echo \"Host files helper provisioned (socket: /var/run/flexserver/host-files/files.sock, uid=\${API_UID}, gid=\${API_GID}).\"
          "
          $SSH "cd '$DEPLOY_PATH' && docker compose run --rm api node dist/db/migrate.js"
          $SSH "cd '$DEPLOY_PATH' && docker compose run --rm api node dist/db/migrate.js --include-optional" || echo "Optional Timescale migration failed or is unavailable; continuing with core PostgreSQL schema."
          # Provision the external AI keyring after core migrations so the CLI
          # encrypted-data guard can consult the storage driver on a fresh DB.
          "${SSH_BASE[@]}" "
            set -euo pipefail
            API_UID_GID=\"\$(docker run --rm --entrypoint sh '$API_IMAGE' -lc 'printf \"%s:%s\" \"\$(id -u)\" \"\$(id -g)\"')\"
            if [[ ! \"\$API_UID_GID\" =~ ^[0-9]+:[0-9]+$ ]]; then
              echo \"Error: Could not determine API container runtime UID/GID for $API_IMAGE.\" >&2
              exit 1
            fi
            API_UID=\"\${API_UID_GID%%:*}\"
            API_GID=\"\${API_UID_GID##*:}\"
            KEYRING_DIR=\"/etc/flexserver\"
            AI_KEYRING_FILE=\"\${KEYRING_DIR}/ai-keyring.json\"
            sudo mkdir -p \"\$KEYRING_DIR\"
            sudo chown \"\${API_UID}:\${API_GID}\" \"\$KEYRING_DIR\"
            sudo chmod 0750 \"\$KEYRING_DIR\"
            if sudo test -f \"\$AI_KEYRING_FILE\"; then
              echo \"Preserving existing AI keyring at \$AI_KEYRING_FILE.\"
              sudo chown \"\${API_UID}:\${API_GID}\" \"\$AI_KEYRING_FILE\"
              sudo chmod 0600 \"\$AI_KEYRING_FILE\"
            else
              echo \"Initializing external AI key encryption keyring...\"
              cd '$DEPLOY_PATH' && docker compose run --rm --no-deps -v \"\${KEYRING_DIR}:/run/flexserver-ai-admin:rw\" -e AI_KEYRING_FILE=/run/flexserver-ai-admin/ai-keyring.json api node dist/scripts/manage-ai-keys.js init
              sudo chown \"\${API_UID}:\${API_GID}\" \"\$AI_KEYRING_FILE\"
              sudo chmod 0600 \"\$AI_KEYRING_FILE\"
            fi
          "
          # Bootstrap/rotate dashboard admin password if secret is provided
          if [ -n "$DASHBOARD_ADMIN_PASSWORD" ]; then
            printf '%s\n' "$DASHBOARD_ADMIN_PASSWORD" | $SSH "cd '$DEPLOY_PATH' && docker compose run --rm -T api node dist/scripts/set-dashboard-password.js --stdin --skip-if-same"
            echo "Dashboard admin password set/verified."
          else
            echo "DASHBOARD_ADMIN_PASSWORD secret not set — dashboard password must be set manually via SSH after deploy."
          fi
          if ! $SSH "cd '$DEPLOY_PATH' && docker compose up -d --remove-orphans --force-recreate api web"; then
            $SSH "cd '$DEPLOY_PATH' && docker compose ps -a && docker compose logs --no-color --tail=100 api" || true
            $SSH "cd '$DEPLOY_PATH' && docker compose exec -T api node -e \"fetch('http://127.0.0.1:3000/api/health').then(async r=>console.log(r.status,await r.text())).catch(e=>console.error(e))\"" || true
            exit 1
          fi
          $SSH "cd '$DEPLOY_PATH' && docker compose ps"
          $SSH "for i in \$(seq 1 30); do curl -fsS http://127.0.0.1:3000/api/health && exit 0; sleep 2; done; docker compose -f '$DEPLOY_PATH/docker-compose.yml' logs --tail=80; exit 1"
          # Refresh or bootstrap local updater on the host using the shared helper from deployed API image
          echo "Updating host local-updater using shared preparation helper..."
          # Reuse the authenticated SSH connection; scp uses -P, not ssh's -p.
          tar -C scripts/install -cf - prepare-agent-updater.sh install-updater.sh installer-lib.sh flexserverctl.py bootstrap-ssh-keyring.sh | "${SSH_BASE[@]}" "tar -xf - -C /tmp && chmod 0755 /tmp/prepare-agent-updater.sh /tmp/install-updater.sh /tmp/installer-lib.sh /tmp/flexserverctl.py /tmp/bootstrap-ssh-keyring.sh"
          "${SSH_BASE[@]}" "
            set -euo pipefail
            SUDO=\"\"
            if [ \"\$(id -u)\" -ne 0 ]; then
              if command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
                SUDO=\"sudo -n\"
              elif command -v sudo >/dev/null 2>&1; then
                SUDO=\"sudo\"
              fi
            fi

            echo 'Running shared host updater preparation...'
            if ! \$SUDO /tmp/prepare-agent-updater.sh --compose-file '$DEPLOY_PATH/docker-compose.yml' --image '$API_IMAGE'; then
              echo 'Warning: Host updater preparation encountered an issue; dashboard deployment remains healthy.' >&2
            else
              echo 'Host local-updater successfully prepared.'
            fi
            rm -f /tmp/prepare-agent-updater.sh /tmp/install-updater.sh /tmp/installer-lib.sh /tmp/flexserverctl.py /tmp/bootstrap-ssh-keyring.sh
          "
          echo "Host local-updater refresh completed."
