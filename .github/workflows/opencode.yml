name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    if: |
      contains(github.event.comment.body, ' /oc') ||
      startsWith(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, ' /opencode') ||
      startsWith(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Require repository write permission
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.event.comment.user.login }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ "$ACTOR" = "github-actions[bot]" ]; then
            echo "Allowing scheduled trigger from ${ACTOR}."
            exit 0
          fi
          permission="$(gh api "repos/${REPOSITORY}/collaborators/${ACTOR}/permission" --jq '.permission' 2>/dev/null || echo none)"
          case "$permission" in
            admin|maintain|write)
              echo "Actor ${ACTOR} has ${permission} permission."
              ;;
            *)
              echo "Refusing to run opencode for actor ${ACTOR}; repository write permission is required (got: ${permission})."
              exit 1
              ;;
          esac

      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Run opencode
        uses: anomalyco/opencode/github@10c894bdeef3618f5666fb506ef7f9491bb964d8
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        with:
          model: openai/gpt-5.5
