# Opt-in Docker Compose override for the external Compose keyring. Demo defaults
# remain unchanged when this file is omitted. The keyring is distinct from the
# SSH keyring despite sharing the external /etc/flexserver directory.
# Host directory: mode 0750, owned by the API runtime UID:GID; keyring file:
# mode 0600, owned by the same UID:GID. Provision separately before enabling.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.keyring.yml up -d
#
services:
  api:
    volumes:
      - /etc/flexserver:/etc/flexserver:ro
    environment:
      COMPOSE_KEYRING_FILE: /etc/flexserver/compose-keyring.json
