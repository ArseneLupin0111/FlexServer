services:
  postgres:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_DB: vps_manager
      POSTGRES_USER: vps_manager
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment or .env file}
    volumes:
      - vps-manager-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vps_manager -d vps_manager"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  migrate:
    build:
      context: .
      target: api-runtime
    command: ["node", "dist/db/migrate.js"]
    environment:
      APP_MODE: demo
      STORAGE_DRIVER: postgres
      DATABASE_URL: postgres://vps_manager:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment or .env file}@postgres:5432/vps_manager
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      target: api-runtime
    # Loopback-only host access for local development; the API is not internet-public.
    # Production traffic should enter through the web/nginx reverse proxy on the Docker network.
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      PORT: "3000"
      APP_MODE: ${APP_MODE:-demo}
      ENABLE_WEB_TERMINAL: ${ENABLE_WEB_TERMINAL:-false}
      ALLOW_PRIVATE_NETWORK_TARGETS: ${ALLOW_PRIVATE_NETWORK_TARGETS:-false}
      DATA_DIR: /app/data
      PRIVATE_DIR: /app/private
      STORAGE_DRIVER: postgres
      DATABASE_URL: postgres://vps_manager:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment or .env file}@postgres:5432/vps_manager
      DASHBOARD_PUBLIC_ORIGIN: ${DASHBOARD_PUBLIC_ORIGIN:-}
      DASHBOARD_SESSION_SECRET: ${DASHBOARD_SESSION_SECRET:-}
      DASHBOARD_SESSION_TTL_SECONDS: ${DASHBOARD_SESSION_TTL_SECONDS:-86400}
      DASHBOARD_COOKIE_SECURE: ${DASHBOARD_COOKIE_SECURE:-false}
      DASHBOARD_COOKIE_SAME_SITE: ${DASHBOARD_COOKIE_SAME_SITE:-lax}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-0}
      TERMINAL_GLOBAL_LIMIT: ${TERMINAL_GLOBAL_LIMIT:-10}
      TERMINAL_DASHBOARD_LIMIT: ${TERMINAL_DASHBOARD_LIMIT:-3}
      TERMINAL_VPS_LIMIT: ${TERMINAL_VPS_LIMIT:-2}
      TERMINAL_PENDING_LIMIT: ${TERMINAL_PENDING_LIMIT:-10}
      TERMINAL_OPEN_TIMEOUT_MS: ${TERMINAL_OPEN_TIMEOUT_MS:-10000}
      TERMINAL_IDLE_TIMEOUT_MS: ${TERMINAL_IDLE_TIMEOUT_MS:-900000}
      TERMINAL_LIFETIME_MS: ${TERMINAL_LIFETIME_MS:-7200000}
      TERMINAL_REVOCATION_POLL_MS: ${TERMINAL_REVOCATION_POLL_MS:-5000}
      TERMINAL_HEARTBEAT_MS: ${TERMINAL_HEARTBEAT_MS:-30000}
      TERMINAL_OUTPUT_BUFFER_BYTES: ${TERMINAL_OUTPUT_BUFFER_BYTES:-1048576}
      TERMINAL_INPUT_BUFFER_BYTES: ${TERMINAL_INPUT_BUFFER_BYTES:-65536}
      TERMINAL_SLOW_CONSUMER_TIMEOUT_MS: ${TERMINAL_SLOW_CONSUMER_TIMEOUT_MS:-10000}
      # Agent release catalog (opt-in). Both key and URL must be set together or
      # the API fails closed at startup; empty keeps the catalog unavailable.
      AGENT_RELEASE_PUBLIC_KEY: ${AGENT_RELEASE_PUBLIC_KEY:-}
      AGENT_RELEASE_MANIFEST_URL: ${AGENT_RELEASE_MANIFEST_URL:-}
      AGENT_RELEASE_TTL_SECONDS: ${AGENT_RELEASE_TTL_SECONDS:-300}
      LOCAL_PTY_SOCKET_PATH: ${LOCAL_PTY_SOCKET_PATH:-/var/run/flexserver/host-pty/host-pty.sock}
      LOCAL_AGENT_ROTATION_HELPER: ${LOCAL_AGENT_ROTATION_HELPER:-/usr/local/bin/local-agent-rotation-client}
      LOCAL_AGENT_ROTATION_SOCKET: ${LOCAL_AGENT_ROTATION_SOCKET:-/var/run/flexserver/agent-rotation/agent-rotation.sock}
      SSH_KEY_ENCRYPTION_KEY_FILE: ${SSH_KEY_ENCRYPTION_KEY_FILE:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    volumes:
      - vps-manager-data:/app/data
      - vps-manager-private:/app/private
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    build:
      context: .
      target: web-runtime
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  vps-manager-data:
  vps-manager-private:
  vps-manager-postgres:
