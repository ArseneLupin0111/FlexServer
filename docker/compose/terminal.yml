# Opt-in Docker Compose override to enable local host web terminal.
# Mounts the dedicated host-pty Unix domain socket from the host system.
# The host-pty daemon runs as a root systemd service on the host, creating
# the socket at /var/run/flexserver/host-pty/host-pty.sock with 0660 permissions
# granted to the API runtime UID/GID.
#
# The Docker daemon socket (/var/run/docker.sock) is NEVER mounted.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker/compose/terminal.yml up -d
#
services:
  api:
    volumes:
      - /var/run/flexserver:/var/run/flexserver
    environment:
      LOCAL_PTY_SOCKET_PATH: /var/run/flexserver/host-pty/host-pty.sock
